<!doctype html>
<html lang="ru">
  <body style="margin:0;padding:32px 16px;background:#080808;color:#ededed;font-family:Arial,sans-serif;">
    <table role="presentation" style="width:100%;max-width:460px;margin:0 auto;border:1px solid #292929;border-radius:16px;background:#111111;">
      <tr><td style="padding:32px;">
        <p style="margin:0 0 28px;font-size:22px;font-weight:bold;letter-spacing:-0.5px;">noctgram</p>
        <h1 style="margin:0 0 14px;font-size:24px;font-weight:normal;">Ваш код входа</h1>

        <p style="margin:0 0 24px;padding:20px;background:#1b1b1b;border:1px solid #333;border-radius:10px;font-size:32px;letter-spacing:8px;text-align:center;">{{ .Token }}</p>
        <p style="margin:0 0 12px;color:#b0b0b0;font-size:14px;line-height:1.6;">Код действует 5 минут. Никому его не сообщайте.</p>
        <p style="margin:0;color:#858585;font-size:13px;line-height:1.6;">Если вы не запрашивали вход, просто проигнорируйте это письмо.</p>
      </td></tr>
    </table>
