<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Onest'; font-weight: 300 800; src: url(assets/fonts/onest-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: 'Onest'; font-weight: 300 800; src: url(assets/fonts/onest-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2212, U+FEFF, U+FFFD; }
        #root { position: absolute; inset: 0; color: #fff; font-family: 'Onest', sans-serif; perspective: 1400px; perspective-origin: 50% 50%; }
        .f4-stage { position: absolute; left: 540px; top: 960px; width: 0; height: 0; transform-style: preserve-3d; }
        .f4-card { position: absolute; left: 0; top: 0; transform-style: preserve-3d; --dof: 0px; filter: blur(var(--dof)); }
        .f4-surface { background: #0c0c0c; border: 2px solid rgba(255, 255, 255, 0.14); border-radius: 30px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
        .f4-title { position: absolute; left: 0; right: 0; top: 890px; text-align: center; font-weight: 800; font-size: 118px; line-height: 1.04; letter-spacing: -0.045em; }
        .f4-title span { display: block; }
        .f4-title .f4-dim { font-weight: 300; color: rgba(255, 255, 255, 0.62); }
        /* мини-пост */
        .f4-post { width: 380px; padding: 22px; }
        .f4-row { display: flex; align-items: center; gap: 14px; }
        .f4-ava { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d9ccff, #6d58a8); flex: none; }
        .f4-name { font-weight: 800; font-size: 26px; }
        .f4-meta { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: rgba(255, 255, 255, 0.55); }
        .f4-img { display: block; margin-top: 16px; width: 336px; height: 190px; border-radius: 16px; object-fit: cover; }
        /* истории */
        .f4-stories { display: flex; gap: 18px; padding: 22px 26px; }
        .f4-ring { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #af9add; padding: 6px; }
        .f4-ring.f4-seen { border-color: rgba(255, 255, 255, 0.2); }
        .f4-ring i { display: block; width: 100%; height: 100%; border-radius: 50%; }
        /* сообщение */
        .f4-bubble { padding: 24px 32px; border-radius: 34px 34px 34px 10px; background: #121212; border: 2px solid rgba(255, 255, 255, 0.1); font-size: 34px; white-space: nowrap; }
        /* звонок */
        .f4-call { display: flex; align-items: center; gap: 18px; padding: 18px 28px 18px 18px; border-radius: 60px; background: #161616; border: 2px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }
        .f4-green { width: 64px; height: 64px; border-radius: 50%; background: #3ecf8e; display: grid; place-items: center; }
        .f4-green svg { width: 30px; height: 30px; }
        .f4-calltext { font-size: 28px; font-weight: 800; }
        .f4-calltext em { display: block; font-style: normal; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 20px; color: rgba(255, 255, 255, 0.55); }
        /* музыка */
        .f4-music { display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 16px; border-radius: 26px; background: #161616; border: 2px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }
        .f4-cover { width: 76px; height: 76px; border-radius: 16px; background: radial-gradient(circle at 30% 30%, #c9b6ff, #3a2d66); }
        .f4-mt { font-size: 28px; font-weight: 800; }
        .f4-mt em { display: block; font-style: normal; font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 20px; color: rgba(255, 255, 255, 0.55); }
        .f4-eq { display: flex; align-items: flex-end; gap: 5px; height: 40px; }
        .f4-eq i { display: block; width: 7px; height: 100%; border-radius: 4px; background: #af9add; transform-origin: 50% 100%; }
        .f4-png { display: block; }
      </style>
      <div id="root" data-composition-id="f4-cloud" data-width="1080" data-height="1920">
        <div class="f4-stage" id="f4-stage">
          <div class="f4-card" data-x="-300" data-y="-560" data-z="40" data-ry="14">
            <div class="f4-surface f4-post">
              <div class="f4-row"><span class="f4-ava"></span><div><div class="f4-name">лёва</div><div class="f4-meta">@leva.moon</div></div></div>
              <img class="f4-img" src="assets/post-moon.jpg" alt="" />
            </div>
          </div>
          <div class="f4-card" data-x="250" data-y="-700" data-z="-320" data-ry="-10">
            <div class="f4-surface f4-stories">
              <span class="f4-ring"><i style="background: radial-gradient(circle at 30% 30%, #f2b8c6, #8a4f6b)"></i></span>
              <span class="f4-ring"><i style="background: radial-gradient(circle at 30% 30%, #9ed0c4, #2f6b5d)"></i></span>
              <span class="f4-ring f4-seen"><i style="background: radial-gradient(circle at 30% 30%, #ffd9a0, #8a5a2b)"></i></span>
            </div>
          </div>
          <div class="f4-card" data-x="300" data-y="-340" data-z="120" data-ry="-16">
            <div class="f4-bubble">ты тоже не спишь?</div>
          </div>
          <div class="f4-card" data-x="-290" data-y="330" data-z="80" data-ry="12">
            <div class="f4-call">
              <span class="f4-green"><svg viewBox="0 0 24 24"><path fill="#000" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></span>
              <span class="f4-calltext">мила<em>звонок · 00:42</em></span>
            </div>
          </div>
          <div class="f4-card" data-x="270" data-y="380" data-z="-220" data-ry="-12">
            <div class="f4-music">
              <span class="f4-cover"></span>
              <span class="f4-mt">лунный вальс<em>noct lofi</em></span>
              <span class="f4-eq"><i></i><i></i><i></i><i></i></span>
            </div>
          </div>
          <div class="f4-card" data-x="-360" data-y="620" data-z="-120" data-ry="18">
            <img class="f4-png" src="assets/noct-stars.png" alt="" style="width: 170px" />
          </div>
          <div class="f4-card" data-x="330" data-y="660" data-z="140" data-ry="-8">
            <img class="f4-png" src="assets/gifts/astral_shard.webp" alt="" style="width: 190px" />
          </div>
          <div class="f4-card" data-x="-40" data-y="-900" data-z="-460" data-ry="0">
            <img class="f4-png" src="assets/noct-premium.png" alt="" style="width: 150px" />
          </div>
        </div>
        <div class="f4-title" id="f4-title"><span>всё это —</span><span class="f4-dim">в одном месте</span></div>
      </div>
      <script>
        (() => {
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const cards = Array.from(document.querySelectorAll(".f4-card"));
            const GOLD = Math.PI * (3 - Math.sqrt(5));
            // Сцена приходит справа — продолжение движения прошлой склейки.
            tl.fromTo("#f4-stage", { x: 200, rotationY: -14 }, { x: 0, rotationY: 0, duration: 1.1, ease: "power3.out" }, 0);
            cards.forEach((card, i) => {
              const w = card.offsetWidth, h = card.offsetHeight;
              const X = +card.dataset.x - w / 2, Y = +card.dataset.y - h / 2, Z = +card.dataset.z, RY = +card.dataset.ry;
              const a = i * GOLD;
              tl.fromTo(
                card,
                { x: X + Math.cos(a) * 520, y: Y + Math.sin(a) * 700, z: -1700 - (i % 3) * 300, rotationX: Math.sin(a) * 50, rotationY: RY + Math.cos(a) * 60, opacity: 0, "--dof": "18px" },
                { x: X, y: Y, z: Z, rotationX: 0, rotationY: RY, opacity: 1, "--dof": "0px", duration: 1.05, ease: "expo.out" },
                0.05 + i * 0.07,
              );
            });
            tl.fromTo("#f4-title span", { opacity: 0, y: 40, filter: "blur(18px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.14 }, 0.45);
            // Глубина резкости: дальние карточки уходят в расфокус, фокус на заголовке.
            cards.forEach((card) => {
              const Z = +card.dataset.z;
              if (Z < 0) tl.to(card, { "--dof": `${Math.min(10, 3 + (-Z / 60))}px`, opacity: 0.55, duration: 0.5, ease: "power2.inOut" }, 1.45);
            });
            // Эквалайзер в такт (доля 0.5 с), конечный.
            document.querySelectorAll(".f4-eq i").forEach((bar, i) => {
              tl.fromTo(bar, { scaleY: 0.3 + (i % 2) * 0.3 }, { scaleY: 1, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 9 }, 0.02 + i * 0.06);
            });
            // Zoom-through: камера пролетает сквозь облако.
            tl.to("#f4-stage", { z: 900, duration: 0.3, ease: "power2.in" }, 2.7);
            tl.to(cards, { opacity: 0, "--dof": "14px", duration: 0.25, ease: "power2.in" }, 2.72);
            tl.to("#f4-title", { scale: 1.4, opacity: 0, filter: "blur(14px)", duration: 0.26, ease: "power2.in" }, 2.72);
            window.__timelines["f4-cloud"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
