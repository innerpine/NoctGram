<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>NoctGram — TikTok</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/lottie.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1080" data-height="1920">
      <div id="bg" class="scene" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="28" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="f1-hook" class="scene" data-composition-id="f1-hook" data-composition-src="compositions/f1-hook.html" data-start="0" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f2-logo" class="scene" data-composition-id="f2-logo" data-composition-src="compositions/f2-logo.html" data-start="3" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f3-tokens" class="scene" data-composition-id="f3-tokens" data-composition-src="compositions/f3-tokens.html" data-start="6" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f4-cloud" class="scene" data-composition-id="f4-cloud" data-composition-src="compositions/f4-cloud.html" data-start="9" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f5-feed" class="scene" data-composition-id="f5-feed" data-composition-src="compositions/f5-feed.html" data-start="12" data-duration="3.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f6-chat" class="scene" data-composition-id="f6-chat" data-composition-src="compositions/f6-chat.html" data-start="15.5" data-duration="3.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f7-music" class="scene" data-composition-id="f7-music" data-composition-src="compositions/f7-music.html" data-start="19" data-duration="2" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f8-premium" class="scene" data-composition-id="f8-premium" data-composition-src="compositions/f8-premium.html" data-start="21" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="f9-outro" class="scene" data-composition-id="f9-outro" data-composition-src="compositions/f9-outro.html" data-start="24" data-duration="4" data-track-index="1" data-width="1080" data-height="1920"></div>

      <audio id="bgm" src="assets/music.wav" data-start="0" data-duration="28" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
