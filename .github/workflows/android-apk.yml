name: Build NoctGram APK
on:
  push:
    branches: ['markdev/noctgram-android-*']
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noctgram-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Save test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NoctGram-android-tests
          path: mobile/android/app/build/reports/tests
          retention-days: 7
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NoctGram-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
